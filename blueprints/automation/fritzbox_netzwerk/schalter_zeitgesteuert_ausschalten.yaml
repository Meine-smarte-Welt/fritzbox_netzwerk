blueprint:
  name: "FRITZ!Box Netzwerk – Schalter zeitgesteuert ausschalten (z. B. Gast-WLAN)"
  description: >
    Schaltet einen Schalter dieser Integration automatisch nach einer
    festgelegten Dauer wieder aus, sobald er eingeschaltet wird - zum
    Beispiel "Gast-WLAN nur bei Besuch: 2 h einschalten, Rest erledigt
    sich von selbst" (Idee 13 aus feature-ideen.md). Gedacht vor allem
    für den Gast-WLAN-Schalter, funktioniert aber mit jedem Schalter
    dieser Integration (z. B. auch für ein einzelnes WLAN-Band).

    Einschalten bleibt manuell - per Dashboard, Sprachassistent oder einer
    eigenen Automation/einem NFC-Tag. Dieses Blueprint übernimmt nur das
    zuverlässige Wiederausschalten, damit "kurz Gast-WLAN an für den
    Besuch" nicht dauerhaft eingeschaltet bleibt, weil es jemand vergisst.
    Wird der Schalter während der Wartezeit erneut ein- oder ausgeschaltet,
    beginnt die Wartezeit von vorn (Ausführungsmodus "restart") - damit
    verlängert ein zwischenzeitliches Aus-/wieder-Einschalten die Zeit
    automatisch, statt zwei sich überschneidende Automationen laufen zu
    lassen.
  domain: automation
  source_url: https://github.com/Meine-smarte-Welt/fritzbox_netzwerk/blob/main/blueprints/automation/fritzbox_netzwerk/schalter_zeitgesteuert_ausschalten.yaml
  input:
    schalter:
      name: Schalter
      description: >
        Ein Schalter dieser Integration, z. B. "Gast-WLAN" oder ein
        einzelnes WLAN-Band. Setzt voraus, dass die FRITZ!Box-Steuerung in
        den Integrationsoptionen aktiviert ist.
      selector:
        entity:
          domain: switch
    dauer:
      name: Dauer
      description: Wie lange der Schalter eingeschaltet bleiben soll.
      default:
        hours: 2
        minutes: 0
        seconds: 0
      selector:
        duration:

mode: restart

trigger:
  - platform: state
    entity_id: !input schalter
    to: "on"

condition: []

action:
  - delay: !input dauer
  - action: switch.turn_off
    target:
      entity_id: !input schalter
