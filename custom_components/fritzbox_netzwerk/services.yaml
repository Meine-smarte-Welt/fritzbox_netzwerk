set_device_name:
  fields:
    mac:
      required: true
      example: "3C:A6:F6:00:11:22"
      selector:
        text:
    name:
      required: true
      example: "Drucker Arbeitszimmer"
      selector:
        text:

wake_on_lan:
  fields:
    mac:
      required: true
      example: "3C:A6:F6:00:11:22"
      selector:
        text:

set_internet_access:
  fields:
    mac:
      required: true
      example: "3C:A6:F6:00:11:22"
      selector:
        text:
    blocked:
      required: true
      example: true
      selector:
        boolean:

set_mac_filter:
  fields:
    enabled:
      required: true
      example: true
      selector:
        boolean:

start_pairing:
  fields:
    minutes:
      required: false
      example: 5
      selector:
        number:
          min: 1
          max: 120
          unit_of_measurement: min
          mode: box
