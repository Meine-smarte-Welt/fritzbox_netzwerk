set_device_name:
  fields:
    mac:
      required: true
      example: "3C:A6:F6:00:11:22"
      selector:
        text:
    name:
      required: true
      example: "Drucker Arbeitszimmer"
      selector:
        text:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: fritzbox_netzwerk

wake_on_lan:
  fields:
    mac:
      required: true
      example: "3C:A6:F6:00:11:22"
      selector:
        text:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: fritzbox_netzwerk

set_internet_access:
