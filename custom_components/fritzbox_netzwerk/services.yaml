      required: true
      example: true
      selector:
        boolean:
    minutes:
      required: false
      example: 60
      selector:
        number:
          min: 1
          max: 10080
          unit_of_measurement: min
    config_entry:
      required: false
      selector:
        config_entry:
          integration: fritzbox_netzwerk

